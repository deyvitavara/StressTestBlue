[package]
name = "stresstestblue"
version = "0.1.0"
edition = "2024"
authors = ["Blue-DTM"]
license = "MIT OR Apache-2.0"
description = "Herramienta de pruebas de carga y rendimiento para APIs REST"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
once_cell = "1.19"
tower = "0.5"
hyper = "1.0"
axum = { version = "0.7", features = ["macros"] }
csv = "1.3"
colored = "3.0.0"
chrono = "0.4"